<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>dududuuuuu 工作台</title>
<style>
:root {
  --bg: #f8f9fb;
  --card: #ffffff;
  --text: #1a1a2e;
  --text2: #8a8a9a;
  --text3: #b8b8c8;
  --border: #f0f0f5;
  --primary: #5eead4;
  --primary-dark: #2dd4bf;
  --primary-light: #ccfbf1;
  --danger: #ff6b6b;
  --success: #4ade80;
  --warning: #fbbf24;
  --pink: #f9a8d4;
  --purple: #c4b5fd;
  --blue: #93c5fd;
  --orange: #fdba74;
  --radius: 20px;
  --radius-sm: 14px;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --nav-h: 64px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  max-width: 430px;
  margin: 0 auto;
  min-height: 100vh;
  position: relative;
  padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 20px);
}

/* ===== 视图 ===== */
.view { display: none; }
.view.active { display: block; animation: fadeIn 0.25s ease; }
@keyframes fadeIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }

/* ===== 首页头图 ===== */
.home-header {
  background: linear-gradient(135deg, #a5f3fc 0%, #c4b5fd 30%, #f9a8d4 60%, #fdba74 100%);
  border-radius: 0 0 30px 30px;
  padding: 40px 20px 30px;
  position: relative;
  overflow: hidden;
}
.home-header::before {
  content: ''; position: absolute; top: -50%; right: -20%; width: 200px; height: 200px;
  background: rgba(255,255,255,0.15); border-radius: 50%;
}
.home-avatar {
  width: 56px; height: 56px; border-radius: 50%;
  background: rgba(255,255,255,0.3); backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; margin-bottom: 12px;
  border: 2px solid rgba(255,255,255,0.4);
}
.home-title { font-size: 22px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.1); }
.home-sub { font-size: 14px; color: rgba(255,255,255,0.9); margin-top: 6px; }

/* ===== 任务卡片列表 ===== */
.task-list { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.task-card {
  background: var(--card); border-radius: var(--radius-sm);
  padding: 16px; display: flex; align-items: center; gap: 14px;
  box-shadow: var(--shadow); position: relative; cursor: pointer;
  transition: transform 0.15s;
}
.task-card:active { transform: scale(0.98); }
.task-card.active-item { background: linear-gradient(135deg, #a7f3d0 0%, #6ee7b7 100%); }
.task-icon {
  width: 48px; height: 48px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; flex-shrink: 0;
}
.task-icon.green { background: #dcfce7; }
.task-icon.blue { background: #dbeafe; }
.task-icon.yellow { background: #fef9c3; }
.task-icon.pink { background: #fce7f3; }
.task-icon.purple { background: #ede9fe; }
.task-icon.teal { background: #ccfbf1; }
.task-icon.orange { background: #ffedd5; }
.task-icon.red { background: #fee2e2; }
.task-info { flex: 1; }
.task-name { font-size: 16px; font-weight: 600; }
.task-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
.task-num {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--border); color: var(--text3);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600; flex-shrink: 0;
}
.task-card.active-item .task-num { background: rgba(255,255,255,0.4); color: #fff; }

/* ===== 底部导航 ===== */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  height: var(--nav-h); padding-bottom: var(--safe-bottom);
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex; justify-content: space-around; align-items: center;
  max-width: 430px; margin: 0 auto;
}
.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 10px; cursor: pointer; border: none; background: none;
  color: var(--text3); font-size: 10px; transition: color 0.15s;
}
.nav-item .nav-icon { font-size: 22px; }
.nav-item.active { color: var(--primary-dark); }
.nav-item.active .nav-icon { filter: drop-shadow(0 2px 4px rgba(45,212,191,0.3)); }

/* ===== 模块页面顶部 ===== */
.mod-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px 8px;
}
.mod-header-left { display: flex; align-items: center; gap: 10px; }
.mod-menu-btn {
  width: 36px; height: 36px; border-radius: 10px; border: none;
  background: var(--card); font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow);
}
.mod-title { font-size: 18px; font-weight: 700; }
.mod-date { font-size: 12px; color: var(--text2); }

/* ===== 统计大卡片 ===== */
.stat-card {
  margin: 0 16px 16px; border-radius: var(--radius);
  padding: 20px; color: #fff; position: relative; overflow: hidden;
  box-shadow: var(--shadow);
}
.stat-card.green { background: linear-gradient(135deg, #86efac 0%, #4ade80 100%); }
.stat-card.blue { background: linear-gradient(135deg, #93c5fd 0%, #60a5fa 100%); }
.stat-card.purple { background: linear-gradient(135deg, #c4b5fd 0%, #a78bfa 100%); }
.stat-card.pink { background: linear-gradient(135deg, #f9a8d4 0%, #f472b6 100%); }
.stat-card.teal { background: linear-gradient(135deg, #5eead4 0%, #2dd4bf 100%); }
.stat-card.orange { background: linear-gradient(135deg, #fdba74 0%, #fb923c 100%); }
.stat-card.red { background: linear-gradient(135deg, #fca5a5 0%, #f87171 100%); }

.stat-card-hd { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.stat-card-label { font-size: 13px; opacity: 0.9; }
.stat-card-emoji { font-size: 28px; }
.stat-card-value { font-size: 36px; font-weight: 700; letter-spacing: -1px; }
.stat-card-sub { font-size: 12px; opacity: 0.85; margin-top: 4px; }

/* 小统计卡 */
.mini-cards { display: flex; gap: 8px; margin: 0 16px 16px; }
.mini-card {
  flex: 1; background: var(--card); border-radius: var(--radius-sm);
  padding: 14px; text-align: center; box-shadow: var(--shadow);
}
.mini-card-val, .mini-val { font-size: 20px; font-weight: 700; }
.mini-card-label, .mini-label { font-size: 11px; color: var(--text2); margin-top: 2px; display: block; }

/* ===== 内容卡片 ===== */
.content-card {
  background: var(--card); border-radius: var(--radius-sm);
  padding: 16px; margin: 0 16px 12px;
  box-shadow: var(--shadow);
}
.card-hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.card-title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.card-stat { font-size: 12px; color: var(--text2); }

/* ===== 表单 ===== */
.form-row { display: flex; gap: 8px; margin-bottom: 10px; }
.form-row input, .form-row select, .form-row textarea {
  flex: 1; padding: 10px 12px; border: 1px solid var(--border);
  border-radius: 12px; font-size: 14px; font-family: inherit; background: #fff;
}
.form-row input:focus, .form-row select:focus, .form-row textarea:focus { outline: none; border-color: var(--primary-dark); }
.form-row input[readonly] { background: var(--bg); color: var(--text2); }
.form-row textarea { resize: vertical; min-height: 60px; }

.btn-add {
  width: 40px; height: 40px; border-radius: 50%; border: none;
  background: var(--primary); color: #fff; font-size: 20px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; box-shadow: 0 2px 8px rgba(45,212,191,0.3);
}
.btn-add:active { transform: scale(0.95); }

.btn-primary {
  width: 100%; padding: 12px; border: none; border-radius: 12px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
}
.btn-primary:active { opacity: 0.9; }

.btn-sm {
  padding: 6px 14px; border-radius: 8px; border: none;
  background: var(--bg); font-size: 12px; cursor: pointer; color: var(--text2);
}
.btn-sm.active { background: var(--primary-dark); color: #fff; }

/* ===== 数据管理栏 ===== */
.data-mgr-bar {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px; margin: 0 16px 8px;
  background: var(--card); border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
}
.data-mgr-btn {
  padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--bg); font-size: 12px; cursor: pointer; color: var(--text2);
  transition: all 0.15s;
}
.data-mgr-btn:active { background: var(--primary-light); border-color: var(--primary); color: var(--primary-dark); }
.data-mgr-hint { font-size: 11px; color: var(--text3); margin-left: auto; }

/* ===== 列表项 ===== */
.list-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 0; border-bottom: 1px solid var(--border);
}
.list-item:last-child { border-bottom: none; }
.list-item-main { flex: 1; min-width: 0; }
.list-item-title { font-weight: 500; font-size: 14px; }
.list-item-sub { font-size: 12px; color: var(--text2); margin-top: 2px; word-break: break-all; }
.list-item-check {
  width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 12px; flex-shrink: 0; transition: all 0.15s;
}
.list-item-check.done { background: var(--success); border-color: var(--success); color: #fff; }
.list-item.done .list-item-title { text-decoration: line-through; color: var(--text3); }
.btn-delete {
  width: 28px; height: 28px; border-radius: 50%; border: none;
  background: #fee2e2; color: var(--danger); font-size: 16px; cursor: pointer;
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
}

/* ===== 浮动添加按钮 ===== */
.fab {
  position: fixed; bottom: calc(var(--nav-h) + var(--safe-bottom) + 16px);
  right: 16px; z-index: 90;
  width: 56px; height: 56px; border-radius: 50%;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: #fff; font-size: 28px; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(45,212,191,0.35);
  transition: transform 0.2s;
}
.fab:active { transform: scale(0.92); }

/* ===== 进度条 ===== */
.progress-bar { height: 8px; background: rgba(255,255,255,0.3); border-radius: 4px; overflow: hidden; margin: 8px 0; }
.progress-fill { height: 100%; background: rgba(255,255,255,0.7); border-radius: 4px; transition: width 0.4s ease; }

/* ===== 日历 ===== */
.cal-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.cal-nav-btn { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text2); padding: 4px 12px; }
.cal-nav-title { font-size: 14px; font-weight: 600; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal-day-hd { font-size: 11px; color: var(--text3); padding: 4px 0; }
.cal-day {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  font-size: 13px; border-radius: 10px; cursor: pointer; transition: all 0.15s;
  position: relative;
}
.cal-day.other { color: var(--text3); }
.cal-day.today { background: var(--primary-light); color: var(--primary-dark); font-weight: 600; }
.cal-day.period { background: #fbcfe8; color: #be185d; font-weight: 600; }
.cal-day.predict { background: #fce7f3; color: #db2777; }
.cal-day.ovulation { background: #ede9fe; color: #7c3aed; }

/* ===== 心情选择 ===== */
.mood-grid { display: flex; justify-content: space-around; padding: 10px 0; flex-wrap: wrap; gap: 8px; }
.mood-btn {
  width: 48px; height: 48px; border-radius: 50%; border: 2px solid transparent;
  background: var(--bg); font-size: 24px; cursor: pointer;
  transition: all 0.2s;
}
.mood-btn.selected { border-color: var(--primary-dark); background: var(--primary-light); transform: scale(1.1); }

.mood-day-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 8px; }
.mood-day {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  font-size: 16px; border-radius: 8px; background: var(--bg);
}
.mood-day.has-mood { background: #fef9c3; }

/* ===== 标签页 ===== */
.tabs { display: flex; gap: 8px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 4px; }
.tab {
  flex-shrink: 0; padding: 8px 16px; border-radius: 20px; border: none;
  background: var(--bg); font-size: 13px; cursor: pointer; color: var(--text2);
  transition: all 0.15s;
}
.tab.active { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: #fff; }

/* 衣橱 */
.closet-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.closet-item { position: relative; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); background: var(--bg); }
.closet-item img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
.closet-placeholder { width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 40px; background: var(--bg); }
.closet-info { padding: 8px; }
.closet-name { font-size: 13px; font-weight: 600; }
.closet-meta { font-size: 11px; color: var(--text2); margin-top: 2px; }

.outfit-pick {
  width: 44px; height: 44px; border-radius: 10px; overflow: hidden; border: 2px solid transparent;
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 20px; background: var(--bg);
}
.outfit-pick img { width: 100%; height: 100%; object-fit: cover; }
.outfit-pick.selected { border-color: var(--primary-dark); }

/* DIY 搭配 */
.diy-preview {
  display: flex; gap: 8px; justify-content: center; align-items: flex-end;
  background: linear-gradient(135deg, #faf5ff 0%, #f0f9ff 100%);
  border-radius: var(--radius-sm); padding: 16px; min-height: 200px;
  margin-bottom: 12px;
}
.diy-slot {
  width: 100px; min-height: 140px; border-radius: 12px;
  border: 2px dashed var(--border); background: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; color: var(--text3); position: relative;
  overflow: hidden; cursor: pointer;
}
.diy-slot.filled { border-style: solid; border-color: var(--primary-dark); }
.diy-slot img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
.diy-slot-label { font-size: 10px; color: var(--text2); text-align: center; margin-bottom: 4px; }
.diy-slot-wrap { display: flex; flex-direction: column; align-items: center; }
.diy-slot-clear {
  position: absolute; top: 4px; right: 4px; width: 20px; height: 20px;
  border-radius: 50%; background: rgba(0,0,0,0.5); color: #fff; border: none;
  font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.diy-pick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.diy-pick-item { border-radius: 10px; overflow: hidden; cursor: pointer; border: 2px solid transparent; aspect-ratio: 1; position: relative; }
.diy-pick-item img { width: 100%; height: 100%; object-fit: cover; }
.diy-pick-item.selected { border-color: var(--primary-dark); }
.diy-pick-item .dp-name { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.4); color: #fff; font-size: 10px; padding: 2px 4px; }
.diy-pick-placeholder { display: flex; align-items: center; justify-content: center; font-size: 24px; background: var(--bg); width: 100%; height: 100%; }

/* 穿搭灵感 */
.inspire-card {
  background: var(--card); border-radius: var(--radius-sm); padding: 16px;
  box-shadow: var(--shadow); margin-bottom: 12px;
}
.inspire-preview { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; }
.inspire-slot { width: 80px; height: 80px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 24px; background: var(--bg); }
.inspire-slot img { width: 100%; height: 100%; object-fit: cover; }
.inspire-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.inspire-tag { font-size: 11px; padding: 3px 10px; border-radius: 12px; background: var(--bg); color: var(--text2); }
.inspire-actions { display: flex; gap: 8px; margin-top: 10px; }
.inspire-btn { flex: 1; padding: 8px; border-radius: 10px; border: none; font-size: 13px; cursor: pointer; }
.inspire-btn.save { background: var(--primary-light); color: var(--primary-dark); }
.inspine-btn.save.saved { background: var(--primary-dark); color: #fff; }
.inspire-btn.skip { background: var(--bg); color: var(--text2); }

/* 行内表单 */
.inline-form { display: flex; gap: 6px; align-items: center; }
.inline-form input { flex: 1; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; }
.inline-form select { padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; }
.btn-icon {
  width: 34px; height: 34px; border-radius: 8px; border: none;
  background: var(--primary); color: #fff; font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}

/* ===== 空状态 ===== */
.empty { text-align: center; color: var(--text3); padding: 30px 0; font-size: 13px; }

/* ===== Toast ===== */
.toast {
  position: fixed; bottom: calc(var(--nav-h) + var(--safe-bottom) + 20px);
  left: 50%; transform: translateX(-50%) translateY(10px);
  background: var(--text); color: #fff; padding: 10px 20px;
  border-radius: 20px; font-size: 13px; z-index: 200;
  opacity: 0; pointer-events: none; transition: all 0.25s;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ===== 编辑弹窗 ===== */
.modal { position: fixed; inset: 0; z-index: 150; display: none; }
.modal.show { display: block; }
.modal-mask { position: absolute; inset: 0; background: rgba(0,0,0,0.3); }
.modal-content {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: #fff; border-radius: 24px 24px 0 0;
  max-height: 80vh; padding: 20px; overflow-y: auto;
  animation: slideUp 0.25s ease;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.modal-hd h3 { font-size: 17px; font-weight: 700; }
.modal-close { background: none; border: none; font-size: 20px; color: var(--text2); cursor: pointer; }

.edit-item {
  display: flex; align-items: center; gap: 10px; padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.edit-drag { color: var(--text3); font-size: 16px; cursor: grab; }
.edit-name { flex: 1; border: none; background: var(--bg); padding: 8px 10px; border-radius: 8px; font-size: 14px; }
.edit-toggle { width: 40px; height: 24px; border-radius: 12px; border: none; background: var(--border); cursor: pointer; position: relative; flex-shrink: 0; }
.edit-toggle.on { background: var(--success); }
.edit-toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform 0.2s; }
.edit-toggle.on::after { transform: translateX(16px); }
.edit-del { width: 24px; height: 24px; border-radius: 50%; border: none; background: #fee2e2; color: var(--danger); font-size: 14px; cursor: pointer; flex-shrink: 0; }
.edit-add { display: flex; gap: 8px; margin-top: 12px; }
.edit-add input { flex: 1; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; }

/* 搜索下拉 */
.search-wrap { position: relative; }
.search-dd {
  position: absolute; top: 100%; left: 0; right: 0; z-index: 50;
  background: #fff; border: 1px solid var(--border); border-radius: 10px;
  max-height: 200px; overflow-y: auto; display: none;
}
.search-dd.show { display: block; }
.search-dd-item { padding: 8px 12px; cursor: pointer; display: flex; justify-content: space-between; font-size: 13px; border-bottom: 1px solid var(--border); }
.search-dd-item:last-child { border-bottom: none; }
.search-dd-item:active { background: var(--bg); }

canvas { display: block; width: 100%; }

/* 图片上传 */
input[type=file] { font-size: 12px; }

/* ===== 幸福打卡 / 朋友圈 ===== */
.moment-feed { padding: 0 16px 16px; }
.moment-item {
  background: var(--card); border-radius: var(--radius);
  padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow);
}
.moment-hd { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.moment-avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: linear-gradient(135deg, #f9a8d4 0%, #c4b5fd 100%);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
}
.moment-name { font-size: 14px; font-weight: 600; }
.moment-time { font-size: 11px; color: var(--text3); margin-top: 2px; }
.moment-text { font-size: 14px; line-height: 1.6; margin-bottom: 10px; word-break: break-word; white-space: pre-wrap; }
.moment-imgs { display: grid; gap: 4px; margin-bottom: 10px; }
.moment-imgs.cols-1 { grid-template-columns: 1fr; }
.moment-imgs.cols-1 img { width: 100%; border-radius: 12px; max-height: 300px; object-fit: cover; }
.moment-imgs.cols-2 { grid-template-columns: repeat(2, 1fr); }
.moment-imgs.cols-2 img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; }
.moment-imgs.cols-3 { grid-template-columns: repeat(3, 1fr); }
.moment-imgs.cols-3 img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; }
.moment-ft { display: flex; align-items: center; justify-content: space-between; padding-top: 10px; border-top: 1px solid var(--border); }
.moment-like { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--text2); cursor: pointer; }
.moment-like.liked { color: var(--danger); }
.moment-del { width: 28px; height: 28px; border-radius: 50%; border: none; background: #fee2e2; color: var(--danger); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.moment-empty { text-align: center; color: var(--text3); padding: 40px 0; font-size: 13px; }
.moment-img-previews { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.moment-img-previews .preview-box { position: relative; }
.moment-img-previews img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }
.moment-img-previews .preview-del {
  position: absolute; top: -6px; right: -6px; width: 20px; height: 20px;
  border-radius: 50%; background: rgba(0,0,0,0.6); color: #fff; border: none;
  font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.moment-textarea {
  width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 12px;
  font-size: 14px; font-family: inherit; background: #fff; resize: vertical; min-height: 80px;
}
.moment-textarea:focus { outline: none; border-color: var(--primary-dark); }
.moment-add-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.moment-add-row label {
  width: 40px; height: 40px; border-radius: 10px; border: 2px dashed var(--border);
  display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--text3); cursor: pointer;
}
.moment-publish {
  margin-left: auto; padding: 8px 20px; border-radius: 20px; border: none;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
}
.moment-publish:active { opacity: 0.9; }
.moment-img-counter { font-size: 11px; color: var(--text3); }

/* 每日塑形 */
.shape-progress { margin-bottom: 16px; }
.shape-progress-hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.shape-progress-label { font-size: 14px; font-weight: 600; }
.shape-progress-val { font-size: 14px; color: var(--danger); font-weight: 600; }
.shape-progress-bar { height: 10px; background: var(--border); border-radius: 5px; overflow: hidden; }
.shape-progress-fill { height: 100%; background: linear-gradient(90deg, #f9a8d4 0%, #f472b6 100%); border-radius: 5px; transition: width 0.4s ease; }

.shape-task-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 0; border-bottom: 1px solid var(--border);
}
.shape-task-item:last-child { border-bottom: none; }
.shape-task-check {
  width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex-shrink: 0; transition: all 0.2s; background: #fff;
}
.shape-task-check.done { background: var(--danger); border-color: var(--danger); color: #fff; }
.shape-task-name { flex: 1; font-size: 14px; }
.shape-task-name.done { text-decoration: line-through; color: var(--text3); }
.shape-task-edit, .shape-task-del {
  width: 28px; height: 28px; border-radius: 8px; border: none;
  font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.shape-task-edit { background: #fce7f3; color: #db2777; }
.shape-task-del { background: #fee2e2; color: var(--danger); }

.shape-stat-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
.shape-stat-row:last-child { border-bottom: none; }
.shape-stat-name { font-size: 14px; }
.shape-stat-count { font-size: 14px; color: var(--text2); }
.shape-stat-count .num { color: var(--danger); font-weight: 600; }

/* 相册模式 */
.album-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
.album-thumb { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; cursor: pointer; transition: transform 0.15s; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
.album-thumb:active { transform: scale(0.95); }
.album-thumb-placeholder { width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 28px; border-radius: 10px; background: rgba(255,255,255,0.6); }
.album-more { text-align: center; padding: 8px; }
.album-more-btn { background: none; border: none; color: var(--text2); font-size: 13px; cursor: pointer; padding: 6px 16px; border-radius: 16px; background: rgba(255,255,255,0.6); }

/* 全屏相册查看器 */
.album-viewer {
  position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.92);
  display: none; flex-direction: column; animation: fadeIn 0.2s ease;
}
.album-viewer.show { display: flex; }
.album-viewer-hd {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 20px; color: #fff; flex-shrink: 0;
}
.album-viewer-title { font-size: 16px; font-weight: 600; }
.album-viewer-close { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; padding: 4px 12px; }
.album-viewer-body { flex: 1; overflow-y: auto; padding: 0 16px 20px; }
.album-viewer-item { margin-bottom: 20px; }
.album-viewer-item img { width: 100%; border-radius: 12px; display: block; }
.album-viewer-item .av-info { display: flex; justify-content: space-between; align-items: flex-start; margin-top: 8px; }
.album-viewer-item .av-note { color: #fff; font-size: 14px; line-height: 1.5; flex: 1; word-break: break-word; }
.album-viewer-item .av-date { color: rgba(255,255,255,0.5); font-size: 12px; flex-shrink: 0; margin-left: 10px; }
.album-viewer-item .av-del { background: rgba(255,107,107,0.2); border: none; color: #ff6b6b; font-size: 13px; cursor: pointer; padding: 4px 12px; border-radius: 8px; margin-top: 8px; }
.album-viewer-empty { text-align: center; color: rgba(255,255,255,0.4); padding: 60px 0; font-size: 14px; }
@media (min-width: 500px) {
  body { box-shadow: 0 0 40px rgba(0,0,0,0.06); }
}

<script>
// ==================== 常量 & 工具 ====================

// 生成唯一 ID
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

// YYYY-MM-DD
function todayStr() { return fmtDate(new Date()); }
function fmtDate(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function parseDate(str) {
  if (!str) return null;
  const p = str.split('-');
  return new Date(parseInt(p[0]), parseInt(p[1])-1, parseInt(p[2]));
}
function addDays(date, n) { const d = new Date(date); d.setDate(d.getDate()+n); return d; }
function daysBetween(a, b) { return Math.round((b.getTime() - a.getTime()) / 86400000); }
function timeToMin(t) { const p = t.split(':'); return parseInt(p[0])*60 + parseInt(p[1]); }

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

var toastTimer = null;
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2000);
}

// ==================== 数据模型 ====================
var state = {
  tasks: [

// ==================== 数据持久化（localStorage + 导出/导入备份） ====================
const STORAGE_KEY = 'dudu_v2';
var _loaded = false;

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) { console.error('保存失败', e); }
}

function load() {
  loadLocal();
}

function applyData(parsed) {
  if (parsed.tasks) {
    // 合并而非覆盖：保留代码中新增的任务定义
    var savedTasks = {};
    parsed.tasks.forEach(function(t) { savedTasks[t.id] = t; });
    state.tasks.forEach(function(t) {
      if (savedTasks[t.id]) {
        // 旧任务：用保存的数据覆盖，但保留新定义的字段
        Object.assign(t, savedTasks[t.id]);
      }
    });
    // 添加用户新增的自定义任务（不在默认列表里的）
    parsed.tasks.forEach(function(t) {
      if (!state.tasks.find(function(x) { return x.id === t.id; })) {
        state.tasks.push(t);
      }
    });
    // 重新排序
    state.tasks.sort(function(a,b) { return (a.order||0) - (b.order||0); });
  }
  if (parsed.modules) {
    Object.keys(state.modules).forEach(function(k) {
      if (parsed.modules[k]) {
        state.modules[k] = Object.assign(state.modules[k], parsed.modules[k]);
      }
    });
  }
  _loaded = true;
  // 数据加载后重新渲染
  renderHome();
  renderNav();
}

function loadLocal() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      var parsed = JSON.parse(raw);
      if (parsed.tasks) {
        // 同样的合并逻辑
        var savedTasks = {};
        parsed.tasks.forEach(function(t) { savedTasks[t.id] = t; });
        state.tasks.forEach(function(t) {
          if (savedTasks[t.id]) {
            Object.assign(t, savedTasks[t.id]);
          }
        });
        parsed.tasks.forEach(function(t) {
          if (!state.tasks.find(function(x) { return x.id === t.id; })) {
            state.tasks.push(t);
          }
        });
        state.tasks.sort(function(a,b) { return (a.order||0) - (b.order||0); });
      }
      if (parsed.modules) {
        Object.keys(state.modules).forEach(function(k) {
          if (parsed.modules[k]) {
            state.modules[k] = Object.assign(state.modules[k], parsed.modules[k]);
          }
        });
      }
    }
    _loaded = true;
    renderHome();
    renderNav();
  } catch(e) { console.error('本地加载失败', e); }
}

function switchView(view) {
  currentView = view;
  document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('active'); });
  if (view === 'home') {
    document.getElementById('view-home').classList.add('active');
    renderHome();
  } else if (view === 'more') {
    renderMorePage();
  } else {
    var modView = document.getElementById('view-' + view);
    if (modView) {
      modView.classList.add('active');
      renderModule(view);
    } else {
      createModuleView(view);
      document.getElementById('view-' + view).classList.add('active');
      renderModule(view);
    }
  }
  renderNav();
}

function renderPlan() {
  var tasks = state.modules.plan.dailyTasks.slice();
  var done = tasks.filter(function(t){ return t.done; }).length;
  var total = tasks.length;
  var pct = total ? Math.round(done/total*100) : 0;

  document.getElementById('planProgress').textContent = pct + '%';
  document.getElementById('planDone').textContent = done;
  document.getElementById('planTotal').textContent = total;
  document.getElementById('planBar').style.width = pct + '%';

  var list = document.getElementById('planList');
  if (tasks.length === 0) {
    list.innerHTML = '<div class="empty">还没有任务，添加一个吧～</div>';
  } else {
    tasks.sort(function(a,b){ return (a.time||'99:99').localeCompare(b.time||'99:99'); });
    list.innerHTML = tasks.map(function(t) {
      var doneCls = t.done ? ' done' : '';
      return '<div class="list-item' + doneCls + '">' +
        '<div class="list-item-check ' + (t.done ? 'done' : '') + '" data-id="' + t.id + '">' + (t.done ? '✓' : '') + '</div>' +
        '<div class="list-item-main"><div class="list-item-title">' + esc(t.name) + '</div>' +
        (t.time ? '<div class="list-item-sub">🕐 ' + esc(t.time) + '</div>' : '') + '</div>' +
        '<button class="btn-delete" data-id="' + t.id + '">×</button></div>';
    }).join('');
    list.querySelectorAll('.list-item-check').forEach(function(el) {
      el.addEventListener('click', function() {
        var task = state.modules.plan.dailyTasks.find(function(t){ return t.id === el.dataset.id; });
        if (task) { task.done = !task.done; save(); renderPlan(); }
      });
    });
    list.querySelectorAll('.btn-delete').forEach(function(el) {
      el.addEventListener('click', function() {
        state.modules.plan.dailyTasks = state.modules.plan.dailyTasks.filter(function(t){ return t.id !== el.dataset.id; });
        save(); renderPlan();
      });
    });
  }

  document.getElementById('planAddBtn').onclick = function() {
    var name = document.getElementById('planTaskName').value.trim();
    var time = document.getElementById('planTaskTime').value;
    if (!name) { toast('请输入任务名称'); return; }
    state.modules.plan.dailyTasks.push({ id: uid(), name: name, time: time, done: false });
    save();
    document.getElementById('planTaskName').value = '';
    document.getElementById('planTaskTime').value = '';
    renderPlan();
    toast('已添加');
  };
}

function drawWeightChart(weights) {
  var canvas = document.getElementById('fitWeightChart');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var dpr = window.devicePixelRatio || 1;
  var w = canvas.offsetWidth || 300;
  var h = 140;
  canvas.width = w * dpr; canvas.height = h * dpr;
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  if (weights.length < 2) {
    ctx.fillStyle = '#aeaeb2'; ctx.font = '13px -apple-system'; ctx.textAlign = 'center';
    ctx.fillText('至少需要2条记录才能画图', w/2, h/2); return;
  }
  var recent = weights.slice(-30);
  var vals = recent.map(function(w){ return w.value; });
  var minV = Math.min.apply(null, vals), maxV = Math.max.apply(null, vals);
  if (minV === maxV) { minV -= 1; maxV += 1; }
  var pad = (maxV - minV) * 0.1; minV -= pad; maxV += pad;
  var padL=30, padR=10, padT=10, padB=20;
  var cw = w - padL - padR, ch = h - padT - padB;
  ctx.strokeStyle = '#e5e5ea'; ctx.lineWidth = 0.5; ctx.font = '10px -apple-system'; ctx.fillStyle = '#aeaeb2'; ctx.textAlign = 'right';
  for (var i=0; i<=3; i++) {
    var y = padT + ch * i / 3;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w-padR, y); ctx.stroke();
    ctx.fillText((maxV - (maxV-minV)*i/3).toFixed(1), padL-4, y+3);
  }
  ctx.strokeStyle = '#007aff'; ctx.lineWidth = 2; ctx.beginPath();
  recent.forEach(function(wt, i) {
    var x = padL + cw * i / (recent.length-1);
    var y = padT + ch * (maxV - wt.value) / (maxV - minV);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
  ctx.lineTo(padL + cw, padT + ch); ctx.lineTo(padL, padT + ch); ctx.closePath();
  ctx.fillStyle = 'rgba(0,122,255,0.08)'; ctx.fill();
  ctx.fillStyle = '#007aff';
  recent.forEach(function(wt, i) {
    var x = padL + cw * i / (recent.length-1);
    var y = padT + ch * (maxV - wt.value) / (maxV - minV);
    ctx.beginPath(); ctx.arc(x, y, 2.5, 0, Math.PI*2); ctx.fill();
  });
}

function calcExerciseCal(type, duration) {
  var met = MET_TABLE[type] || 4.0;

}

function renderShapeTasks() {
  var list = document.getElementById('shapeTaskList');
  if (!list) return;

  var today = todayStr();

  if (tasks.length === 0) {
    list.innerHTML = '<div class="empty">还没有塑形任务，添加一个开始打卡吧</div>';
    return;
  }

  list.innerHTML = tasks.map(function(t) {
    var isDone = (t.completions || []).indexOf(today) !== -1;
    var checkClass = isDone ? ' done' : '';
    var nameClass = isDone ? ' done' : '';
    var checkIcon = isDone ? '✓' : '';

      '<input type="text" id="shapeEditInput" value="' + esc(t.name) + '" style="flex:1;padding:6px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px">' :

      '<button class="shape-task-edit" data-id="' + t.id + '">✓</button>' :

    return '<div class="shape-task-item">' +
      '<div class="shape-task-check' + checkClass + '" data-id="' + t.id + '">' + checkIcon + '</div>' +
      name + editBtn +
      '<button class="shape-task-del" data-id="' + t.id + '">🗑️</button>' +
    '</div>';
  }).join('');

  // 打卡
  list.querySelectorAll('.shape-task-check').forEach(function(el) {
    el.addEventListener('click', function() {
      var id = el.dataset.id;
      var task = state.modules.fitness.shapeTasks.find(function(t) { return t.id === id; });
      if (!task) return;
      if (!task.completions) task.completions = [];
      var idx = task.completions.indexOf(today);
      if (idx !== -1) {
        task.completions.splice(idx, 1);
      } else {
        task.completions.push(today);
      }
      save();
      renderShapeProgress();
      renderShapeTasks();
      renderShapeStats();
    });
  });

  // 编辑
  list.querySelectorAll('.shape-task-edit').forEach(function(el) {
    el.addEventListener('click', function() {
      var id = el.dataset.id;
      if (shapeEditingId === id) {
        // 保存
        var input = document.getElementById('shapeEditInput');
        if (input) {
          var task = state.modules.fitness.shapeTasks.find(function(t) { return t.id === id; });
          if (task) { task.name = input.value.trim() || task.name; save(); }
        }
        shapeEditingId = null;
      } else {
        shapeEditingId = id;
      }
      renderShapeTasks();
      if (shapeEditingId === id) {
        var input = document.getElementById('shapeEditInput');
        if (input) { input.focus(); input.select(); }
      }
    });
  });

  // 删除
  list.querySelectorAll('.shape-task-del').forEach(function(el) {
    el.addEventListener('click', function() {
      if (!confirm('确定删除这个任务吗？')) return;
      var id = el.dataset.id;
      state.modules.fitness.shapeTasks = state.modules.fitness.shapeTasks.filter(function(t) { return t.id !== id; });
      save();
      renderShapeProgress();
      renderShapeTasks();
      renderShapeStats();
      toast('已删除');
    });
  });
}

function renderShapeStats() {
  var area = document.getElementById('shapeStatsArea');

  if (tasks.length === 0) {
    area.innerHTML = '<div class="empty">添加任务后显示统计</div>';

  // 计算本周（周一到周日）完成次数

function initFitnessEvents() {

  document.getElementById('fitWeightAddBtn').onclick = function() {

    if (!val || val < 20 || val > 300) { toast('请输入有效体重'); return; }

    if (existing) { existing.value = val; } else { state.modules.fitness.weights.push({ id: uid(), date: date, value: val }); }
    save(); document.getElementById('fitWeightVal').value = ''; renderFitness(); toast('已记录');
  };

  // 食物搜索
  var foodNameInput = document.getElementById('fitFoodName');
  var foodDD = document.getElementById('fitFoodDD');
  foodNameInput.addEventListener('input', function() {
    var q = foodNameInput.value.trim().toLowerCase();
    if (!q) { foodDD.classList.remove('show'); return; }
    var matches = Object.keys(FOOD_DB).filter(function(name){ return name.toLowerCase().indexOf(q) !== -1; }).slice(0, 10);
    if (matches.length === 0) { foodDD.classList.remove('show'); return; }
    foodDD.innerHTML = matches.map(function(name) {
      return '<div class="search-dd-item" data-food="' + esc(name) + '"><span>' + esc(name) + '</span><span>' + FOOD_DB[name] + ' kcal/100g</span></div>';
    }).join('');
    foodDD.classList.add('show');
    foodDD.querySelectorAll('.search-dd-item').forEach(function(el) {
      el.addEventListener('click', function() {
        foodNameInput.value = el.dataset.food;
        foodDD.classList.remove('show');
        document.getElementById('fitFoodAmount').focus();
      });
    });
  });
  document.addEventListener('click', function(e) {
    if (!e.target.closest || !e.target.closest('.search-wrap')) foodDD.classList.remove('show');
  });

  document.getElementById('fitFoodAmount').addEventListener('input', function() {
    var amount = parseFloat(document.getElementById('fitFoodAmount').value);
    var name = foodNameInput.value.trim();
    if (amount > 0 && FOOD_DB[name]) {
      document.getElementById('fitFoodCal').value = Math.round(FOOD_DB[name] * amount / 100);
    } else {
      document.getElementById('fitFoodCal').value = '';
    }
  });

  document.getElementById('fitFoodAddBtn').onclick = function() {
    var meal = document.getElementById('fitMeal').value;
    var name = foodNameInput.value.trim();
    var amount = parseFloat(document.getElementById('fitFoodAmount').value);
    var cal = parseInt(document.getElementById('fitFoodCal').value);
    if (!name) { toast('请选择食物'); return; }
    if (!amount || amount <= 0) { toast('请输入份量'); return; }
    if (!cal && FOOD_DB[name]) { cal = Math.round(FOOD_DB[name] * amount / 100); }
    if (!cal) { toast('未知食物热量，请重新搜索'); return; }
    state.modules.fitness.foods.push({ id: uid(), date: todayStr(), meal: meal, name: name, amount: amount, cal: cal });
    save(); foodNameInput.value = ''; document.getElementById('fitFoodAmount').value = ''; document.getElementById('fitFoodCal').value = '';
    renderFitness(); toast('已记录');
  };

  // 运动消耗自动计算
  function updateExCal() {
    var type = document.getElementById('fitExType').value;
    var dur = parseInt(document.getElementById('fitExDur').value);
    document.getElementById('fitExCal').value = (dur && dur > 0) ? calcExerciseCal(type, dur) : '';
  }
  document.getElementById('fitExType').addEventListener('change', updateExCal);
  document.getElementById('fitExDur').addEventListener('input', updateExCal);

  document.getElementById('fitExAddBtn').onclick = function() {
    var type = document.getElementById('fitExType').value;
    var dur = parseInt(document.getElementById('fitExDur').value);
    if (!dur || dur <= 0) { toast('请输入时长'); return; }
    var cal = calcExerciseCal(type, dur);
    state.modules.fitness.exercises.push({ id: uid(), date: todayStr(), type: type, duration: dur, cal: cal });
    save(); document.getElementById('fitExDur').value = ''; document.getElementById('fitExCal').value = '';
    renderFitness(); toast('已记录');
  };

  document.getElementById('fitTargetSaveBtn').onclick = function() {
    state.modules.fitness.target = {
      height: document.getElementById('fitHeight').value,
      targetWeight: document.getElementById('fitTargetW').value,
      calIn: document.getElementById('fitTargetIn').value,
      calOut: document.getElementById('fitTargetOut').value,
    };
    save(); toast('目标已保存');
  };

  // 每日塑形 - 添加任务
  var shapeAddBtn = document.getElementById('shapeTaskAddBtn');
  if (shapeAddBtn) {
    shapeAddBtn.onclick = function() {
      var input = document.getElementById('shapeTaskInput');
      var name = input ? input.value.trim() : '';
      if (!name) { toast('请输入任务名称'); return; }
      if (!state.modules.fitness.shapeTasks) state.modules.fitness.shapeTasks = [];
      state.modules.fitness.shapeTasks.push({ id: uid(), name: name, completions: [] });
      save();
      if (input) input.value = '';
      renderShapeProgress();
      renderShapeTasks();
      renderShapeStats();
      toast('任务已添加');
    };
  }
}

function getPeriodDates() {
  var dates = {};
  state.modules.period.cycles.forEach(function(c) {
    var start = parseDate(c.startDate);
    if (!start) return;
    var days = c.days || 5;
    for (var i = 0; i < days; i++) dates[fmtDate(addDays(start, i))] = c.id;
  });
  return dates;
}
function getAvgCycle() {
  var cycles = state.modules.period.cycles.slice().sort(function(a,b){ return a.startDate.localeCompare(b.startDate); });
  if (cycles.length < 2) return 28;
  var recent = cycles.slice(-3);
  var diffs = [];
  for (var i = 1; i < recent.length; i++) {
    var d = daysBetween(parseDate(recent[i-1].startDate), parseDate(recent[i].startDate));
    if (d > 0) diffs.push(d);
  }
  if (diffs.length === 0) return 28;
  return Math.round(diffs.reduce(function(s,n){ return s+n; }, 0) / diffs.length);
}
function getLastPeriodStart() {
  var cycles = state.modules.period.cycles.slice().sort(function(a,b){ return a.startDate.localeCompare(b.startDate); });
  if (cycles.length === 0) return null;
  return parseDate(cycles[cycles.length-1].startDate);
}
function getNextPeriodStart() {
  var last = getLastPeriodStart();
  if (!last) return null;
  return addDays(last, getAvgCycle());
}
function getOvulationDate() {
  var next = getNextPeriodStart();
  if (!next) return null;
  return addDays(next, -14);
}

function renderPeriod() {
  var last = getLastPeriodStart();
  if (last) {
    var dayNum = daysBetween(last, new Date()) + 1;
    if (dayNum < 1) dayNum = 1;
    document.getElementById('pdDay').textContent = '第' + dayNum + '天';
  } else {
    document.getElementById('pdDay').textContent = '—';
  }
  document.getElementById('pdAvg').textContent = getAvgCycle() + '天';
  var next = getNextPeriodStart();
  if (next) {
    var daysLeft = daysBetween(new Date(), next);
    document.getElementById('pdNext').textContent = daysLeft > 0 ? daysLeft + '天' : '今天';
  } else {
    document.getElementById('pdNext').textContent = '—';
  }
  renderCalendar();
  renderPeriodList();
}

function renderCalendar() {
  document.getElementById('pdMonthTitle').textContent = calYear + '年' + (calMonth+1) + '月';
  var periodDates = getPeriodDates();
  var nextStart = getNextPeriodStart();
  var ovuDate = getOvulationDate();
  var predictDates = {};
  if (nextStart) {
    var avgDays = state.modules.period.cycles.length > 0 ? (state.modules.period.cycles[state.modules.period.cycles.length-1].days || 5) : 5;
    for (var i = 0; i < avgDays; i++) predictDates[fmtDate(addDays(nextStart, i))] = true;
  }
  var ovuDates = {};
  if (ovuDate) { for (var j = -2; j <= 2; j++) ovuDates[fmtDate(addDays(ovuDate, j))] = true; }
  var today = todayStr();
  var firstDay = new Date(calYear, calMonth, 1);
  var startWeekday = firstDay.getDay();
  var daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  var daysInPrevMonth = new Date(calYear, calMonth, 0).getDate();
  var html = '<div class="cal-grid"><div class="cal-day-hd">日</div><div class="cal-day-hd">一</div><div class="cal-day-hd">二</div><div class="cal-day-hd">三</div><div class="cal-day-hd">四</div><div class="cal-day-hd">五</div><div class="cal-day-hd">六</div>';
  for (var p = startWeekday-1; p >= 0; p--) {
    var dayNum = daysInPrevMonth - p;
    html += '<div class="cal-day other">' + dayNum + '</div>';
  }
  for (var d1 = 1; d1 <= daysInMonth; d1++) {
    var ds1 = fmtDate(new Date(calYear, calMonth, d1));
    var classes = 'cal-day';
    if (ds1 === today) classes += ' today';
    if (periodDates[ds1]) classes += ' period';
    else if (predictDates[ds1]) classes += ' predict';
    else if (ovuDates[ds1]) classes += ' ovulation';
    html += '<div class="' + classes + '" data-date="' + ds1 + '">' + d1 + '</div>';
  }
  var totalCells = startWeekday + daysInMonth;
  var remaining = (7 - totalCells % 7) % 7;
  for (var n = 1; n <= remaining; n++) html += '<div class="cal-day other">' + n + '</div>';
  html += '</div>';
  document.getElementById('pdCalendar').innerHTML = html;
  document.getElementById('pdCalendar').querySelectorAll('.cal-day').forEach(function(el) {
    el.addEventListener('click', function() { onCalendarDayClick(el.dataset.date); });
  });
}

function onCalendarDayClick(dateStr) {
  if (!dateStr) return;
  var periodDates = getPeriodDates();
  var cycleId = periodDates[dateStr];
  if (cycleId) {
    state.modules.period.cycles = state.modules.period.cycles.filter(function(c){ return c.id !== cycleId; });
    save(); renderPeriod(); toast('已删除经期记录');
  } else {
    var days = parseInt(document.getElementById('pdEndDays').value) || 5;
    state.modules.period.cycles.push({ id: uid(), startDate: dateStr, endDate: fmtDate(addDays(parseDate(dateStr), days-1)), days: days });
    save(); renderPeriod(); toast('已标记经期');
  }
}

function renderPeriodList() {
  var cycles = state.modules.period.cycles.slice().sort(function(a,b){ return b.startDate.localeCompare(a.startDate); });
  var list = document.getElementById('pdList');
  if (cycles.length === 0) { list.innerHTML = '<div class="empty">还没有经期记录</div>'; return; }
  list.innerHTML = cycles.map(function(c) {
    return '<div class="list-item"><div class="list-item-main"><div class="list-item-title">' + c.startDate + ' ~ ' + c.endDate + '</div><div class="list-item-sub">持续 ' + c.days + ' 天</div></div><button class="btn-delete" data-id="' + c.id + '">×</button></div>';
  }).join('');
  list.querySelectorAll('.btn-delete').forEach(function(el) {
    el.addEventListener('click', function() {
      state.modules.period.cycles = state.modules.period.cycles.filter(function(c){ return c.id !== el.dataset.id; });
      save(); renderPeriod();
    });
  });
}

function initPeriodEvents() {
  document.getElementById('pdPrev').addEventListener('click', function() { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderCalendar(); });
  document.getElementById('pdNextBtn').addEventListener('click', function() { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderCalendar(); });
  document.getElementById('pdAddBtn').onclick = function() {
    var start = document.getElementById('pdStart').value;
    var days = parseInt(document.getElementById('pdEndDays').value) || 5;
    if (!start) { toast('请选择开始日期'); return; }
    var endDate = fmtDate(addDays(parseDate(start), days-1));
    state.modules.period.cycles.push({ id: uid(), startDate: start, endDate: endDate, days: days });
    save(); document.getElementById('pdStart').value = ''; renderPeriod(); toast('已记录');
  };
}

// 穿搭灵感
function renderInspire() {
  var area = document.getElementById('inspireArea');
  if (!area) return;
  var items = state.modules.closet.items || [];

  var tops = items.filter(function(i){ return i.cat === '上装'; });
  var bots = items.filter(function(i){ return i.cat === '下装'; });
  var dresses = items.filter(function(i){ return i.cat === '连衣裙'; });
  var outers = items.filter(function(i){ return i.cat === '外套'; });
  var shoes = items.filter(function(i){ return i.cat === '鞋履'; });
  var accs = items.filter(function(i){ return i.cat === '配饰'; });

  if (tops.length === 0 && dresses.length === 0) {
    area.innerHTML = '<div class="empty">至少添加一件上装或连衣裙后即可生成灵感 ✨</div>';
    return;
  }

  // 生成3套随机灵感
  var inspirations = [];
  var styleNames = ['通勤优雅', '休闲日常', '约会甜美', '运动活力', '简约高级', '周末放松', '都市时髦', '温柔气质'];
  var colorTips = ['同色系搭配显高级', '撞色搭配更吸睛', '基础色+亮色点缀', '深浅渐变有层次', '全身不超3种主色'];

  for (var n = 0; n < 3; n++) {
    var combo = [];
    var tags = [];

    // 随机选风格
    var style = styleNames[Math.floor(Math.random() * styleNames.length)];
    tags.push(style);

    // 主体搭配：连衣裙 或 上装+下装
    if (dresses.length > 0 && (tops.length === 0 || Math.random() > 0.5)) {
      var dress = dresses[Math.floor(Math.random() * dresses.length)];
      combo.push(dress);
      tags.push('连衣裙');
    } else if (tops.length > 0 && bots.length > 0) {
      combo.push(tops[Math.floor(Math.random() * tops.length)]);
      combo.push(bots[Math.floor(Math.random() * bots.length)]);
      tags.push('上+下');
    } else if (dresses.length > 0) {
      combo.push(dresses[Math.floor(Math.random() * dresses.length)]);
      tags.push('连衣裙');
    } else {
      combo.push(tops[Math.floor(Math.random() * tops.length)]);
    }

    // 随机加外套
    if (outers.length > 0 && Math.random() > 0.4) {
      combo.push(outers[Math.floor(Math.random() * outers.length)]);
      tags.push('加外套');
    }
    // 随机加鞋履

      save(); renderTripDetail();

  container.querySelectorAll('[data-trip][data-day]').forEach(function(btn) {

        save(); renderTripDetail();

        btn.dataset.confirming = 'true'; btn.textContent = '?'; btn.style.background = 'var(--danger)'; btn.style.color = '#fff';

      var ci = parseInt(el.dataset.checklist);

    btn.addEventListener('click', function() {

        var ci = parseInt(btn.dataset.delChecklist);

        setTimeout(function() {
          if (btn.dataset.confirming === 'true') { btn.dataset.confirming = 'false'; btn.textContent = '×'; btn.style.background = ''; btn.style.color = ''; }
        }, 3000);
      }
    });
  });

  var archBtn = container.querySelector('[data-archive]');
  if (archBtn) {
    archBtn.addEventListener('click', function() { trip.archived = !trip.archived; save(); renderTravel(); });
  }
}

function renderSleep() {

function renderSleepStats() {
  var records = state.modules.sleep.records;
  var weekAgo = fmtDate(addDays(new Date(), -7));
  var weekRecords = records.filter(function(r){ return r.date >= weekAgo; });
  var avgDur = weekRecords.length ? Math.round(weekRecords.reduce(function(s,r){ return s+r.duration; }, 0) / weekRecords.length) : 0;
  document.getElementById('slAvgDur').textContent = avgDur > 0 ? (Math.floor(avgDur/60) + 'h' + (avgDur%60) + 'm') : '—';
  var avgQual = weekRecords.length ? (weekRecords.reduce(function(s,r){ return s+r.quality; }, 0) / weekRecords.length).toFixed(1) : '—';
  document.getElementById('slAvgQual').textContent = avgQual !== '—' ? avgQual + '⭐' : '—';
  var sorted = records.slice().sort(function(a,b){ return b.date.localeCompare(a.date); });
  if (sorted.length) {
    var last = sorted[0], h = Math.floor(last.duration/60), m = last.duration % 60;
    document.getElementById('slLast').textContent = h + 'h' + m + 'm';
  } else { document.getElementById('slLast').textContent = '—'; }
}

function renderSleepList() {
  var records = state.modules.sleep.records.slice().sort(function(a,b){ return b.date.localeCompare(a.date); });
  var list = document.getElementById('sleepList');
  if (records.length === 0) { list.innerHTML = '<div class="empty">还没有睡眠记录</div>'; return; }
  list.innerHTML = records.slice(0, 30).map(function(r) {

  }).join('');

      save(); renderSleep();
    });
  });
}

function renderSleepChart() {
  var canvas = document.getElementById('sleepChart');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var dpr = window.devicePixelRatio || 1;
  var w = canvas.offsetWidth || 300, h = 140;
  canvas.width = w * dpr; canvas.height = h * dpr;
  ctx.scale(dpr, dpr); ctx.clearRect(0, 0, w, h);
  var records = state.modules.sleep.records.slice().sort(function(a,b){ return a.date.localeCompare(b.date); });
  if (records.length < 2) {
    ctx.fillStyle = '#aeaeb2'; ctx.font = '13px -apple-system'; ctx.textAlign = 'center';
    ctx.fillText('至少需要2条记录', w/2, h/2); return;
  }
  var recent = records.slice(-14);
  var maxDur = Math.max.apply(null, recent.map(function(r){ return r.duration; }));
  var minDur = Math.min.apply(null, recent.map(function(r){ return r.duration; }));
  if (maxDur === minDur) { maxDur += 60; minDur -= 60; }
  if (minDur < 0) minDur = 0;
  var padL=30, padR=10, padT=10, padB=20;
  var cw = w - padL - padR, ch = h - padT - padB;
  ctx.strokeStyle = '#e5e5ea'; ctx.lineWidth = 0.5; ctx.font = '10px -apple-system'; ctx.fillStyle = '#aeaeb2'; ctx.textAlign = 'right';
  for (var i = 0; i <= 3; i++) {
    var y = padT + ch * i / 3;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w-padR, y); ctx.stroke();
    var val = maxDur - (maxDur-minDur) * i / 3;
    ctx.fillText(Math.floor(val/60) + 'h', padL-4, y+3);
  }
  var barW = cw / recent.length * 0.6;
  var colors = ['#ff3b30','#ff9500','#ffcc00','#34c759','#007aff'];
  recent.forEach(function(r, i) {
    var x = padL + cw * (i+0.5) / recent.length - barW / 2;
    var barH = ch * (r.duration - minDur) / (maxDur - minDur);
    var by = padT + ch - barH;
    ctx.fillStyle = colors[Math.min(r.quality-1, 4)] || '#007aff';
    ctx.fillRect(x, by, barW, barH);
  });
}

function initSleepEvents() {
  function updateDuration() {
    var start = document.getElementById('slStart').value;
    var end = document.getElementById('slEnd').value;
    if (start && end) {
      var dur = timeToMin(end) - timeToMin(start);
      if (dur < 0) dur += 24*60;
      document.getElementById('slDuration').value = Math.floor(dur/60) + '小时' + (dur%60) + '分钟';
    } else { document.getElementById('slDuration').value = ''; }
  }
  document.getElementById('slStart').addEventListener('input', updateDuration);
  document.getElementById('slEnd').addEventListener('input', updateDuration);

  document.getElementById('slAddBtn').onclick = function() {
    var date = document.getElementById('slDate').value || todayStr();
    var start = document.getElementById('slStart').value;
    var end = document.getElementById('slEnd').value;
    var quality = parseInt(document.getElementById('slQuality').value);
    if (!start || !end) { toast('请输入入睡和起床时间'); return; }
    var dur = timeToMin(end) - timeToMin(start);
    if (dur < 0) dur += 24*60;
    var existing = state.modules.sleep.records.find(function(r){ return r.date === date; });
    if (existing) { existing.start = start; existing.end = end; existing.duration = dur; existing.quality = quality; }
    else { state.modules.sleep.records.push({ id: uid(), date: date, start: start, end: end, duration: dur, quality: quality }); }
    save();
    document.getElementById('slStart').value = ''; document.getElementById('slEnd').value = ''; document.getElementById('slDuration').value = '';
    renderSleep(); toast('已记录');
  };
}

function calcAge(birth) {
  var b = parseDate(birth);
  if (!b) return '';
  var now = new Date();
  var months = (now.getFullYear() - b.getFullYear()) * 12 + (now.getMonth() - b.getMonth());
  if (months < 1) months = 1;
  if (months < 12) return months + '月';
  var years = Math.floor(months / 12), remM = months % 12;
  return remM ? years + '岁' + remM + '月' : years + '岁';
}

function initPetEvents() {

    var pet = { id: uid(), name: name, breed: document.getElementById('petBreed').value.trim(), birth: document.getElementById('petBirth').value, avatar: document.getElementById('petAvatar').value };
    state.modules.pet.pets.push(pet);

    save();
    document.getElementById('petName').value = ''; document.getElementById('petBreed').value = ''; document.getElementById('petBirth').value = '';
    renderPet(); toast('已添加');
  };

  // 照片记录
  var petPhotoAddBtn = document.getElementById('petPhotoAddBtn');
  if (petPhotoAddBtn) {
    petPhotoAddBtn.onclick = function() {
      var note = (document.getElementById('petPhotoNote') || {}).value || '';
      var imgFile = (document.getElementById('petPhotoImg') || {}).files[0];
      if (!imgFile && !note) { toast('请上传照片或写点什么'); return; }
      if (!state.modules.pet.photos) state.modules.pet.photos = [];
      var finish = function(imgData) {
        state.modules.pet.photos.push({ id: uid(), date: todayStr(), note: note, img: imgData || '' });
        save();
        var noteEl = document.getElementById('petPhotoNote');
        var imgEl = document.getElementById('petPhotoImg');
        if (noteEl) noteEl.value = '';
        if (imgEl) imgEl.value = '';
        renderPetPhotos();
        toast('已记录可爱瞬间');
      };
      if (imgFile) {
        var reader = new FileReader();
        reader.onload = function(ev) {
          var dataUrl = ev.target.result;
          var sizeKB = Math.round(dataUrl.length * 3 / 4 / 1024);
          if (sizeKB <= 200) { finish(dataUrl); return; }
          var img = new Image();
          img.onload = function() {
            var canvas = document.createElement('canvas');
            var maxW = 400, scale = Math.min(1, maxW / img.width);
            canvas.width = img.width * scale; canvas.height = img.height * scale;
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            finish(canvas.toDataURL('image/jpeg', 0.7));
          };
          img.src = dataUrl;
        };
        reader.readAsDataURL(imgFile);
      } else { finish(''); }
    };
  }

  document.getElementById('petRecAddBtn').onclick = function() {
    if (!currentPetId) { toast('请先添加宠物'); return; }
    var type = document.getElementById('petRecType').value;
    var note = document.getElementById('petRecNote').value.trim();

      state.modules.pet.records.push({ id: uid(), petId: currentPetId, date: todayStr(), type: type, note: note, img: imgData || '' });
      save(); document.getElementById('petRecNote').value = ''; document.getElementById('petRecImg').value = '';
      renderPetRecords(); toast('已记录');
    };
    if (imgFile) {
      var reader = new FileReader();
      reader.onload = function(ev) {
        var dataUrl = ev.target.result;
        var sizeKB = Math.round(dataUrl.length * 3 / 4 / 1024);
        if (sizeKB <= 200) { finish(dataUrl); return; }
        var img = new Image();
        img.onload = function() {
          var canvas = document.createElement('canvas');
          var maxW = 400, scale = Math.min(1, maxW / img.width);
          canvas.width = img.width * scale; canvas.height = img.height * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          finish(canvas.toDataURL('image/jpeg', 0.7));
        };
        img.src = dataUrl;
      };
      reader.readAsDataURL(imgFile);
    } else { finish(''); }
  };
}

  }

  if (photos.length === 0) {
    body.innerHTML = '<div class="album-viewer-empty">还没有照片</div>';
  } else {
    body.innerHTML = photos.map(function(p) {

        '<button class="av-del" data-id="' + p.id + '">删除</button>' +

        if (!confirm('确定删除这张照片吗？')) return;

          state.modules.baby.photos = (state.modules.baby.photos || []).filter(function(p){ return p.id !== id; });

function renderBabyGrowthChart() {
  var canvas = document.getElementById('babyGrowthChart');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var dpr = window.devicePixelRatio || 1;
  var w = canvas.offsetWidth || 300, h = 160;
  canvas.width = w * dpr; canvas.height = h * dpr;
  ctx.scale(dpr, dpr); ctx.clearRect(0, 0, w, h);
  if (!currentBabyId) {
    ctx.fillStyle = '#aeaeb2'; ctx.font = '13px -apple-system'; ctx.textAlign = 'center';
    ctx.fillText('请先添加宝宝', w/2, h/2); return;
  }
  var records = state.modules.baby.records.filter(function(r){ return r.childId === currentBabyId && r.type === '身高体重' && r.data && r.data.height && r.data.weight; });
  if (records.length < 2) {
    ctx.fillStyle = '#aeaeb2'; ctx.font = '13px -apple-system'; ctx.textAlign = 'center';
    ctx.fillText('需要至少2条身高体重记录', w/2, h/2); return;
  }
  records.sort(function(a,b){ return a.date.localeCompare(b.date); });
  var heights = records.map(function(r){ return parseFloat(r.data.height); });
  var weights = records.map(function(r){ return parseFloat(r.data.weight); });
  var minH = Math.min.apply(null, heights), maxH = Math.max.apply(null, heights);
  var minW = Math.min.apply(null, weights), maxW = Math.max.apply(null, weights);
  if (minH === maxH) { minH -= 1; maxH += 1; }
  if (minW === maxW) { minW -= 1; maxW += 1; }
  var padL=35, padR=35, padT=10, padB=20;
  var cw = w - padL - padR, ch = h - padT - padB;
  // 身高线
  ctx.strokeStyle = '#007aff'; ctx.lineWidth = 2; ctx.beginPath();
  records.forEach(function(r, i) {
    var x = padL + cw * i / (records.length-1);
    var y = padT + ch * (maxH - parseFloat(r.data.height)) / (maxH - minH);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
  ctx.fillStyle = '#007aff';
  records.forEach(function(r, i) {
    var x = padL + cw * i / (records.length-1);
    var y = padT + ch * (maxH - parseFloat(r.data.height)) / (maxH - minH);
    ctx.beginPath(); ctx.arc(x, y, 2.5, 0, Math.PI*2); ctx.fill();
  });
  // 体重线
  ctx.strokeStyle = '#ff2d55'; ctx.lineWidth = 2; ctx.beginPath();
  records.forEach(function(r, i) {
    var x = padL + cw * i / (records.length-1);
    var y = padT + ch * (maxW - parseFloat(r.data.weight)) / (maxW - minW);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
  ctx.fillStyle = '#ff2d55';
  records.forEach(function(r, i) {
    var x = padL + cw * i / (records.length-1);
    var y = padT + ch * (maxW - parseFloat(r.data.weight)) / (maxW - minW);
    ctx.beginPath(); ctx.arc(x, y, 2.5, 0, Math.PI*2); ctx.fill();
  });
  // 图例
  ctx.font = '11px -apple-system';
  ctx.fillStyle = '#007aff'; ctx.textAlign = 'left';
  ctx.fillText('— 身高', padL, h - 4);
  ctx.fillStyle = '#ff2d55';
  ctx.fillText('— 体重', padL + 50, h - 4);
}

function compressMomentImage(imgFile, callback) {
  var reader = new FileReader();
  reader.onload = function(ev) {
    var dataUrl = ev.target.result;
    var sizeKB = Math.round(dataUrl.length * 3 / 4 / 1024);
    if (sizeKB <= 200) { callback(dataUrl); return; }
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement('canvas');
      var maxW = 600, scale = Math.min(1, maxW / img.width);
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      callback(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.src = dataUrl;
  };
  reader.readAsDataURL(imgFile);
}

function bindDragSort() {
  var list = document.getElementById('editList');
  var items = list.querySelectorAll('.edit-item');
  var dragEl = null, startY = 0;

  function onStart(e, el) {
    dragEl = el; startY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
    el.style.position = 'relative'; el.style.zIndex = '100'; el.style.opacity = '0.8';
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!dragEl) return;
    var y = (e.clientY || (e.touches && e.touches[0].clientY) || 0) - startY;
    dragEl.style.transform = 'translateY(' + y + 'px)';
    if (e.preventDefault) e.preventDefault();
  }
  function onEnd() {
    if (!dragEl) return;
    var el = dragEl;
    el.style.transform = ''; el.style.position = ''; el.style.zIndex = ''; el.style.opacity = '';
    var rect = el.getBoundingClientRect();
    var centerY = rect.top + rect.height / 2;
    var siblings = Array.from(list.querySelectorAll('.edit-item')).filter(function(s){ return s !== el; });
    var insertBefore = null;
    for (var i = 0; i < siblings.length; i++) {
      var sr = siblings[i].getBoundingClientRect();
      if (centerY < sr.top + sr.height/2) { insertBefore = siblings[i]; break; }
    }
    if (insertBefore) list.insertBefore(el, insertBefore); else list.appendChild(el);
    Array.from(list.querySelectorAll('.edit-item')).forEach(function(item, idx) {
      var task = getTask(item.dataset.id);
      if (task) task.order = idx;
    });
    save();
    dragEl = null;
  }

  items.forEach(function(item) {
    var handle = item.querySelector('.edit-drag');
    handle.addEventListener('touchstart', function(e){ onStart(e, item); }, { passive: false });
    handle.addEventListener('touchmove', onMove, { passive: false });
    handle.addEventListener('touchend', onEnd);
    handle.addEventListener('mousedown', function(e){ onStart(e, item); });
  });
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onEnd);
}

function bindDataManager() {
  var exportBtn = document.getElementById('exportDataBtn');
  var importBtn = document.getElementById('importDataBtn');
  var fileInput = document.getElementById('importFileInput');
  var hint = document.getElementById('dataMgrHint');

  // 更新提示
  updateDataHint();
  function updateDataHint() {
    if (hint) {
      var raw = localStorage.getItem(STORAGE_KEY);
      var size = raw ? (new Blob([raw]).size / 1024).toFixed(1) : '0';
      hint.textContent = '本地数据 ' + size + ' KB';
    }
  }

  // 导出
  if (exportBtn) {
    exportBtn.addEventListener('click', function() {
      var data = JSON.stringify(state, null, 2);
      var blob = new Blob([data], {type: 'application/json'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'dududuuuuu-backup-' + todayStr() + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      updateDataHint();
      toast('备份已下载 ✅');
    });
  }

  // 导入
  if (importBtn) {
    importBtn.addEventListener('click', function() {
      fileInput.click();
    });
  }
  if (fileInput) {
    fileInput.addEventListener('change', function(e) {
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(ev) {
        try {
          var data = JSON.parse(ev.target.result);
          if (!data.tasks && !data.modules) {
            toast('文件格式不正确 ❌'); return;
          }
          if (!confirm('恢复数据将覆盖当前数据，确定继续？')) return;
          applyData(data);
          save();
          updateDataHint();
          toast('数据已恢复 ✅');
        } catch(err) {
          toast('文件解析失败 ❌');
        }
      };
      reader.readAsText(file);
      fileInput.value = '';
    });
  }

  // 覆盖 save 以更新提示
  var origSave = save;
  save = function() {
    origSave();
    updateDataHint();
  };
}

    save(); document.getElementById('newTaskName').value = '';
    openEditModal(); toast('已添加');
  });

  // 监听模块视图创建后初始化事件
  var observer = new MutationObserver(function(mutations) {
    mutations.forEach(function(m) {
      if (m.addedNodes) {
        m.addedNodes.forEach(function(node) {
          if (node.id && node.id.startsWith('view-')) {
            initModuleEvents(node.id.replace('view-', ''));
          }
        });
      }
    });
  });
  observer.observe(document.getElementById('module-views'), { childList: true });

  // 数据导出/导入
  bindDataManager();
}

function initModuleEvents(id) {
  switch(id) {
    case 'fitness': initFitnessEvents(); break;
    case 'period': initPeriodEvents(); break;
    case 'closet': initClosetEvents(); break;
    case 'travel': initTravelEvents(); break;
    case 'sleep': initSleepEvents(); break;
    case 'pet': initPetEvents(); break;
    case 'baby': initBabyEvents(); renderBabyRecFields(); break;
    case 'happiness': initHappinessEvents(); break;
  }
  // 设置默认日期
  var dateIds = ['fitWeightDate','pdStart','outfitDate','slDate','tripStart','tripEnd'];
  var today = todayStr();
  dateIds.forEach(function(did) {
    var el = document.getElementById(did);
    if (el && !el.value) el.value = today;
  });
}

// ==================== 启动 ====================
// 先渲染默认首页（空状态），再异步加载数据
renderHome();
renderNav();
bindGlobalEvents();
load(); // 异步加载服务端数据，加载完成后会重新渲染
</script>
</body>
</html>
